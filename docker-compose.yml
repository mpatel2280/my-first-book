services:
  mongo:
    image: mongo:7
    container_name: mdbook-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
    container_name: mdbook-server
    working_dir: /app/server
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/mdbook_auth
      JWT_SECRET: change-me
      JWT_EXPIRES_IN: 1d
      CLIENT_ORIGIN: http://localhost:5173
      BOOK_ROOT: /app
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin1234
    ports:
      - "4000:4000"
    volumes:
      - ./:/app
      - server-node-modules:/app/server/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - mongo

  client:
    build:
      context: ./client
    container_name: mdbook-client
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - server

volumes:
  mongo-data:
  server-node-modules:
  client-node-modules:
